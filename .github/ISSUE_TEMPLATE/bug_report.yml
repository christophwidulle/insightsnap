name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here — please use
        [private vulnerability reporting](https://github.com/christophwidulle/insightsnap/security/advisories/new).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in chrome://extensions
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Other Chromium-based
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Anthropic Claude
        - OpenAI
        - Google Gemini
        - AWS Bedrock
        - OpenAI-compatible (custom endpoint)
        - Not provider-related / unsure
    validations:
      required: true

  - type: input
    id: video
    attributes:
      label: Video URL
      description: If the bug happens on a specific video, please link it — caption tracks differ a lot between videos.

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: |
        Errors from the page console (F12) and, if relevant, from the service worker
        (chrome://extensions → "service worker"). Please redact your API key.
      render: text
