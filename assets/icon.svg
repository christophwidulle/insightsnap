<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241b3d" />
      <stop offset="1" stop-color="#0f0b1c" />
    </linearGradient>
    <!-- userSpaceOnUse so both shapes share one continuous ramp instead of each
         restarting it inside its own bounding box. -->
    <linearGradient id="spark" gradientUnits="userSpaceOnUse" x1="26" y1="26" x2="102" y2="102">
      <stop offset="0" stop-color="#c4a6ff" />
      <stop offset="1" stop-color="#7c5cff" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)" />

  <!-- Lucide `sparkles` (ISC), filled instead of stroked and scaled from its 24x24 grid
       onto this canvas: translate(16,16) scale(4) puts the star's center on 64,64. The
       icon's small upper-right cross is left out — it turns to mush at the 16px size. -->
  <g transform="translate(16 16) scale(4)" fill="url(#spark)">
    <path
      d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"
    />
    <circle cx="4" cy="20" r="2" opacity="0.85" />
  </g>
</svg>
